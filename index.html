    <script>
      // `js` lets reveal animations hide content; without it (no JS, blocked bundle) everything shows.
      // Safety net: if the app hasn't started within 4s, drop the class so nothing stays hidden.
      document.documentElement.classList.add('js')
      setTimeout(function () {
        if (!window.__portfolioReady) document.documentElement.classList.remove('js')
      }, 4000)

      // Light is the default look. Apply a saved dark preference before first paint to avoid a flash.
      try {
        if (localStorage.getItem('portfolio-theme-v2') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0b')
        }
      } catch (e) {}
    </script>
